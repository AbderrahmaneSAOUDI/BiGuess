name: biguess_studio
description: Independent, public-safe BiGuess Studio web scaffold.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_svg: 2.3.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/biguess_logo.webp
    - assets/icons/dashboard.svg
    - assets/icons/topic.svg
    - assets/icons/pack.svg
    - assets/icons/card.svg
    - assets/icons/profile.svg
    - assets/icons/signin.svg
    - assets/icons/menu.svg
    - assets/icons/error.svg
    - assets/icons/offline.svg
